[project]
name = "agent-hub-core"
version = "1.0.0"
description = "Shared hardened core for JARVIS agents: sandboxed executor, model-agnostic LLM client, structured tracing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai-agent", "sandbox", "llm", "tracing"]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34"]
ollama = ["ollama>=0.3"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_hub_core*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
