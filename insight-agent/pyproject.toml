[project]
name = "insight-agent"
version = "1.0.0"
description = "A conversational data analyst: ask your CSV or database questions in plain English."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = ["ai-agent", "data-analysis", "llm", "fastapi", "pandas"]

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34"]
ollama = ["ollama>=0.3"]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/your-handle/insight-agent"
Repository = "https://github.com/your-handle/insight-agent"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["insight_agent*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's File()/Depends() in defaults is the idiomatic pattern.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
